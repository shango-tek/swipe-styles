<!-- Chat Thread layouts. One <template> per slide type; render.mjs fills the data-field elements.
     Every slide is one screen of a conversation: the header bar with the avatar, the brand name, the
     handle and the counter, then the thread. Received messages (.ct-in) sit on the left in white,
     sent messages (.ct-out) on the right in the accent. A .ct-group holds a run of messages from the
     same side: only its last message gets a tail. -->

<template data-type="cover">
  <section class="slide ct ct-cover">
    <div class="safe">
      <header class="ct-head">
        <svg class="ct-back" viewBox="0 0 24 40" aria-hidden="true"><path d="M19 4 5 20l14 16"/></svg>
        <span class="ct-avatar" data-free aria-hidden="true">
          <svg class="ct-avatar-icon" viewBox="0 0 80 80"><circle cx="40" cy="31" r="14"/><path d="M13 74c2-17 13-25 27-25s25 8 27 25z"/></svg>
          <span class="ct-initial" data-field="name"></span>
          <img class="ct-logo" data-field="logo">
        </span>
        <span class="ct-who"><span class="ct-name" data-field="name"></span><span class="ct-handle" data-field="handle"></span></span>
        <span class="ct-count" data-field="counter"></span>
      </header>
      <div class="ct-thread">
        <p class="ct-day" data-field="kicker"></p>
        <div class="ct-group">
          <h1 class="ct-msg ct-out ct-hook" data-field="title" data-fit-min="64"></h1>
          <p class="ct-msg ct-out ct-follow" data-field="subtitle" data-fit-min="36"></p>
        </div>
        <div class="ct-typing" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
  </section>
</template>

<template data-type="text">
  <section class="slide ct ct-text">
    <div class="safe">
      <header class="ct-head">
        <svg class="ct-back" viewBox="0 0 24 40" aria-hidden="true"><path d="M19 4 5 20l14 16"/></svg>
        <span class="ct-avatar" data-free aria-hidden="true">
          <svg class="ct-avatar-icon" viewBox="0 0 80 80"><circle cx="40" cy="31" r="14"/><path d="M13 74c2-17 13-25 27-25s25 8 27 25z"/></svg>
          <span class="ct-initial" data-field="name"></span>
          <img class="ct-logo" data-field="logo">
        </span>
        <span class="ct-who"><span class="ct-name" data-field="name"></span><span class="ct-handle" data-field="handle"></span></span>
        <span class="ct-count" data-field="counter"></span>
      </header>
      <div class="ct-thread">
        <p class="ct-day" data-field="kicker"></p>
        <h2 class="ct-msg ct-in ct-ask" data-field="title" data-fit-min="44"></h2>
        <div class="ct-reacted">
          <p class="ct-msg ct-out ct-answer" data-field="body" data-fit-min="36"></p>
          <span class="ct-react" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21.2c-.4 0-7.6-4.5-9.7-9.3C.8 8.4 2.9 4.4 6.7 4.4c2.2 0 3.8 1.2 5.3 3.1 1.5-1.9 3.1-3.1 5.3-3.1 3.8 0 5.9 4 4.4 7.5-2.1 4.8-9.3 9.3-9.7 9.3z"/></svg></span>
        </div>
      </div>
    </div>
  </section>
</template>

        <span class="ct-count" data-field="counter"></span>

      <div class="ct-thread">
        <p class="ct-day" data-field="kicker"></p>
        <h2 class="ct-msg ct-in ct-ask" data-field="title" data-fit-min="44"></h2>
        <ul class="ct-group ct-burst" data-list="items">
          <li class="ct-msg ct-out ct-item" data-item data-fit-min="34">
            <span class="ct-item-title" data-item-field="title"></span>
            <span class="ct-item-text" data-item-field="text"></span>
          </li>
        </ul>
      </div>
    </div>

      <div class="ct-thread">
        <p class="ct-sender"><span class="ct-from" data-field="author"></span> <span class="ct-role" data-field="role"></span></p>
        <div class="ct-said">
          <span class="ct-face" data-free data-if="author" aria-hidden="true"><span class="ct-initial" data-field="author"></span></span>
