  <g transform="rotate(-12 360 470)">
    <rect x="170" y="230" width="380" height="500" fill="#f4f4f4"/>
    <circle cx="360" cy="420" r="120" fill="#5a5a5a"/>
    <rect x="220" y="600" width="280" height="26" fill="#2a2a2a"/>
    <rect x="220" y="646" width="200" height="16" fill="#7a7a7a"/>
  </g>
  <g transform="rotate(5 640 450)">
    <rect x="450" y="170" width="380" height="520" fill="#ffffff"/>
    <rect x="500" y="230" width="280" height="260" fill="#9a9a9a"/>
