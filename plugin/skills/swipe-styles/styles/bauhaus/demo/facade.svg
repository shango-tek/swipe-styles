<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- A generic modernist facade in elevation: flat roof, ribbon windows, a glazed stair tower,
       a canopy over the entrance. Drawn for the Bauhaus style demo; not a specific building. -->
  <rect width="800" height="800" fill="#c3c9ce"/>
  <!-- ground -->
  <rect y="604" width="800" height="196" fill="#a3aaaf"/>
  <path d="M0 604H800" stroke="#2b2e31" stroke-width="4"/>
  <g stroke="#2b2e31" stroke-linecap="square" fill="none">
    <path d="M60 650H740M120 700H680M180 750H620" stroke="#7d848a" stroke-width="2"/>
  </g>

  <!-- main block -->
  <rect x="120" y="226" width="430" height="378" fill="#eceeef" stroke="#2b2e31" stroke-width="4"/>
  <!-- roof slab -->
  <rect x="100" y="206" width="470" height="20" fill="#2b2e31"/>

  <!-- ribbon windows: three bands with mullions -->
  <g fill="#8f969c" stroke="#2b2e31" stroke-width="3">
    <rect x="150" y="262" width="370" height="64"/>
    <rect x="150" y="364" width="370" height="64"/>
    <rect x="150" y="466" width="370" height="64"/>
  </g>
  <g stroke="#2b2e31" stroke-width="2">
    <path d="M196 262V326M242 262V326M288 262V326M334 262V326M380 262V326M426 262V326M472 262V326"/>
    <path d="M196 364V428M242 364V428M288 364V428M334 364V428M380 364V428M426 364V428M472 364V428"/>
    <path d="M196 466V530M242 466V530M288 466V530M334 466V530M380 466V530M426 466V530M472 466V530"/>
    <path d="M150 294H520M150 396H520M150 498H520" stroke="#5d6368"/>
  </g>

  <!-- glazed stair tower -->
  <rect x="550" y="168" width="130" height="436" fill="#a9b0b5" stroke="#2b2e31" stroke-width="4"/>
  <rect x="540" y="156" width="150" height="14" fill="#2b2e31"/>
  <g stroke="#2b2e31" stroke-width="2">
    <path d="M582 170V604M615 170V604M648 170V604"/>
    <path d="M550 212H680M550 256H680M550 300H680M550 344H680M550 388H680M550 432H680M550 476H680M550 520H680M550 564H680"/>
  </g>
  <!-- stair flights seen through the glass -->
  <g stroke="#4c5257" stroke-width="3" fill="none">
    <path d="M556 300L674 256M556 388L674 344M556 476L674 432M556 564L674 520"/>
  </g>

  <!-- entrance with canopy -->
  <rect x="200" y="546" width="190" height="10" fill="#2b2e31"/>
  <path d="M206 556V604M384 556V604" stroke="#2b2e31" stroke-width="3"/>
  <rect x="262" y="560" width="66" height="44" fill="#5d6368" stroke="#2b2e31" stroke-width="3"/>
  <path d="M295 560V604" stroke="#2b2e31" stroke-width="2"/>

  <!-- a low wing on the left on slim columns -->
  <rect x="40" y="420" width="80" height="16" fill="#2b2e31"/>
  <rect x="40" y="436" width="80" height="78" fill="#c3c8cc" stroke="#2b2e31" stroke-width="3"/>
  <path d="M52 514V604M108 514V604" stroke="#2b2e31" stroke-width="4"/>
</svg>
