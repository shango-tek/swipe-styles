<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980">
  <defs>
    <radialGradient id="wall" cx="0.46" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#fcfcfc"/>
      <stop offset="0.5" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a2a2a2"/>
      <stop offset="1" stop-color="#7e7e7e"/>
    </linearGradient>
    <linearGradient id="lowL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c9c9c"/>
      <stop offset="1" stop-color="#787878"/>
    </linearGradient>
    <linearGradient id="lowC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6d6d6"/>
      <stop offset="0.35" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="lowR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="upC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcdcdc"/>
      <stop offset="0.35" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#b8b8b8"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.6" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#9e9e9e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Wall and table -->
  <rect width="800" height="980" fill="url(#wall)"/>
  <rect y="780" width="800" height="200" fill="url(#table)"/>
  <rect y="776" width="800" height="6" fill="#727272"/>

  <!-- Shadows on the table -->
  <ellipse cx="420" cy="842" rx="220" ry="22" fill="#3c3c3c" filter="url(#soft)"/>
  <ellipse cx="690" cy="884" rx="98" ry="14" fill="#3c3c3c" filter="url(#soft)"/>

  <!-- Moka pot, drawn at its own scale and set on the table -->
  <g transform="translate(400 840) scale(1.1) translate(-400 -762)">
    <!-- Steam from the spout -->
    <g fill="none" stroke="#8a8a8a" stroke-width="9" stroke-linecap="round">
      <path d="M206 276 C186 246 226 226 206 192 C192 168 216 148 210 120"/>
      <path d="M246 262 C230 240 262 220 248 190"/>
    </g>

    <!-- Lower chamber (boiler) -->
    <polygon points="252,760 330,760 348,560 288,560" fill="url(#lowL)"/>
    <polygon points="330,760 470,760 452,560 348,560" fill="url(#lowC)"/>
    <polygon points="470,760 548,760 512,560 452,560" fill="url(#lowR)"/>
    <polygon points="250,746 550,746 548,762 252,762" fill="#2e2e2e"/>
    <circle cx="303" cy="642" r="14" fill="#5e5e5e"/>
    <circle cx="303" cy="642" r="6" fill="#1e1e1e"/>
    <polygon points="372,744 392,744 388,570 371,570" fill="#ffffff"/>

    <!-- Waist -->
    <polygon points="284,568 516,568 509,538 291,538" fill="#262626"/>

    <!-- Upper chamber -->
    <polygon points="292,540 350,540 332,330 254,330" fill="#a3a3a3"/>
    <polygon points="350,540 450,540 468,330 332,330" fill="url(#upC)"/>
    <polygon points="450,540 508,540 546,330 468,330" fill="#5e5e5e"/>
    <polygon points="372,532 389,532 393,342 373,342" fill="#ffffff"/>

    <!-- Spout -->
    <polygon points="262,348 196,302 266,318" fill="#747474"/>

    <!-- Lid and knob -->
    <polygon points="246,336 554,336 540,308 260,308" fill="#adadad"/>
    <polygon points="262,309 538,309 498,284 302,284" fill="#cacaca"/>
    <rect x="380" y="250" width="40" height="38" rx="7" fill="#161616"/>

    <!-- Handle -->
    <path d="M540 352 L640 358 Q664 360 660 384 L638 512 Q634 532 612 530 L506 512 L510 486 L600 498 Q610 499 611 489 L628 400 Q630 388 618 388 L536 384 Z" fill="#161616"/>
  </g>

  <!-- Espresso cup in front -->
  <g transform="translate(-6 94)">
    <ellipse cx="690" cy="786" rx="98" ry="17" fill="#c2c2c2"/>
    <path d="M752 724 C790 722 792 766 746 764" fill="none" stroke="#959595" stroke-width="10"/>
    <path d="M620 712 L760 712 L748 768 Q744 782 728 782 L652 782 Q636 782 632 768 Z" fill="url(#cup)"/>
    <ellipse cx="690" cy="712" rx="70" ry="12" fill="#262626"/>
  </g>
</svg>
