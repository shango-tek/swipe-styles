<!-- Boarding Pass layouts. One <template> per slide type; render.mjs fills the data-field elements.
     Every slide is the pass itself: the band in the airline color at the top (with the flight route and
     the plane at --progress), the ticket area, a perforated tear line with notches, and the stub.
     .bd-band and .bd-perf are decoration; all text sits in .safe. -->

<template data-type="cover">
  <section class="slide bd bd-cover">
    <div class="bd-band" aria-hidden="true">
      <div class="bd-route">
        <svg class="bd-route-svg" viewBox="0 0 1080 150" width="1080" height="150">
          <path class="bd-todo" d="M96 126 Q540 -70 984 126" />
          <path class="bd-done" d="M96 126 Q540 -70 984 126" pathLength="1" />
          <circle class="bd-from" cx="96" cy="126" r="12" />
          <circle class="bd-to" cx="984" cy="126" r="13" />
          <circle class="bd-to-dot" cx="984" cy="126" r="5" />
        </svg>
        <svg class="bd-plane" viewBox="0 0 64 64" width="92" height="92"><path d="M60 32c0-2.2-2.6-3.6-6-3.6H41L27 6h-6l7.5 22.4H14L9 19H5l3 13-3 13h4l5-9.4h14.5L21 58h6l14-22.4h13c3.4 0 6-1.4 6-3.6z" /></svg>
      </div>
    </div>
    <div class="bd-perf" aria-hidden="true"></div>
    <div class="bd-code bd-cover-code" aria-hidden="true"></div>
    <div class="safe">
      <header class="bd-head">
        <img class="bd-logo" data-field="logo">
        <p class="bd-name" data-field="name"></p>
      </header>
      <div class="bd-main">
        <h1 class="bd-display" data-field="title" data-fit-min="76"></h1>
        <p class="bd-sub" data-field="subtitle" data-fit-min="36"></p>
        <div class="bd-fields">
          <p class="bd-field bd-f-date" data-field="kicker" data-fit-min="26"></p>
          <p class="bd-field bd-f-person" data-field="handle"></p>
          <p class="bd-field bd-f-seat bd-f-end" data-field="counter"></p>
        </div>
      </div>
    </div>
  </section>
</template>
